# Configuration of the UAS dataset generator (plan 3.2).
#
# The generator drives the simulator: it flies the interceptor to a set of
# viewpoints, places the intruder (the Crazyflie, target_drone) at a set of
# poses and labels every camera image from the ground truth of the simulator.
# Nothing is labelled by hand.
#
# The numbers here describe the scenario of the intercept demo: the
# interceptor climbs to 8-13 m and the intruder flies at a similar altitude,
# because the stereo camera is level and its vertical field of view is only
# 47 degrees.

camera:
  # The intrinsics of the stereo left camera. The generator reads them from
  # /stereo/left/camera_info and only falls back to these.
  width: 640
  height: 480
  fx: 554.3827128226441
  fy: 554.3827128226441
  cx: 320.5
  cy: 240.5
  # The near plane of the camera [m] (the clip range in the URDF). An object
  # closer than this is not in the image at all.
  near: 0.5

target:
  # The bounding box of the Crazyflie in its own base_link frame [m]. The body
  # is 100 x 100 mm, the 43 mm props reach 105 mm across and they sit 21 mm
  # above the body centre, so the whole vehicle fits in this box.
  half_x: 0.053
  half_y: 0.053
  z_min: 0.0
  z_max: 0.04

flight:
  # The altitude the interceptor climbs to [m]. The camera is level, so the
  # intruder has to be at a similar altitude to be in the frame.
  altitude: [8.0, 13.0]
  # The area the interceptor flies over [m]: x_min, x_max, y_min, y_max.
  area: [-12.0, 32.0, -12.0, 32.0]
  # The outer position loop: the velocity command is the position error times
  # this gain, clamped.
  position_gain: 0.8
  yaw_gain: 1.2
  max_speed: 6.0
  max_climb: 2.0
  max_yaw_rate: 1.2
  # How long the interceptor is given to reach a new viewpoint [s].
  settle_time: 4.0

sampling:
  # The distance of the intruder from the camera [m]. The engagement happens
  # at 1.5-15 m, so the range is sampled logarithmically.
  distance: [2.0, 25.0]
  # The bearing of the intruder in the camera's frame [deg]. The horizontal
  # field of view is 60 degrees, so a bearing beyond 30 degrees is out of the
  # frame.
  bearing: [-30.0, 30.0]
  # The elevation of the intruder in the camera's frame [deg]. The vertical
  # field of view is 47 degrees.
  elevation: [-12.0, 12.0]
  # The share of the samples that place the intruder outside of the field of
  # view. Those frames are labelled as background.
  negative_fraction: 0.2
  # The number of viewpoints and of samples per viewpoint.
  blocks: 10
  samples_per_block: 30
  # The rate the images are stored at [Hz]. The camera runs at 60 Hz, but
  # consecutive frames of a static scene are duplicates.
  capture_rate: 5.0
  # The offset applied to the timestamp of the image when the pose of the
  # intruder is looked up [s]. The intruder is moved by a timer that runs at
  # 50 Hz, so the image is on average half a period ahead of the last pose
  # that was published.
  tf_time_offset: -0.01

behaviours:
  # The five behaviours of the intruder (plan 3.1). The speed is the one the
  # behaviour is flown at; it is lower than in the demo, because the label of a
  # moving intruder is only as good as the synchronisation of the image with
  # the pose.
  - {name: hover, seconds: 12.0, speed: 0.0}
  - {name: waypoints, seconds: 20.0, speed: 3.0}
  - {name: straight, seconds: 15.0, speed: 6.0}
  - {name: weave, seconds: 15.0, speed: 4.0}
  - {name: curve, seconds: 15.0, speed: 5.0}

trees:
  # The canopies of the trees of the world as vertical cylinders
  # [x, y, radius, height], the same model the ground-truth source uses to
  # decide that a target is hidden. A sample whose line of sight crosses one
  # of these is labelled as background.
  - [20.0, 7.0, 4.0, 6.5]
  - [7.0, 22.0, 4.0, 6.5]
  - [-4.0, 10.0, 4.0, 6.5]
  - [18.0, 23.0, 4.0, 6.5]
  - [24.0, 14.0, 4.0, 6.5]
  - [4.0, -5.0, 1.6, 5.1]
  - [27.0, 6.0, 1.6, 5.1]
  - [-3.0, 22.0, 1.6, 5.1]
  - [26.0, 26.0, 1.6, 5.1]

split:
  # The share of the scenes that go into the training set. The split is done
  # by scene and not by image, so the near-identical frames of a scene do not
  # end up on both sides of the split.
  train_fraction: 0.8
