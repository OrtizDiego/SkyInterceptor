# Vision perception pipeline (launched when perception_source:=vision)

stereo_depth_processor:
  ros__parameters:
    # Stereo rig (must match the camera joints in the URDF)
    stereo.baseline: 0.12   # m
    stereo.fx: 535.4        # px

    # SGBM disparity
    num_disparities: 128    # Must be divisible by 16
    block_size: 11          # Matching window (odd)

    # WLS post-filter
    lambda: 8000.0
    sigma: 1.5

target_detector:
  ros__parameters:
    model_path: "yolov8n.pt"
    confidence_threshold: 0.3
    device: "auto"          # auto | cpu | cuda[:N]

target_3d_localizer:
  ros__parameters:
    target_frame: "map"
    sync_slop: 0.1          # s, detection <-> depth image pairing tolerance
