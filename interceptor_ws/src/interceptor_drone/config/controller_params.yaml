# Trajectory controller (plan §4.5)
# Reserved for P2.1: trajectory_controller_node is still a stub and reads none of these yet.
# Speed caps, altitude limits and the geofence belong to safety_params.yaml.
trajectory_controller_node:
  ros__parameters:
    rate_hz: 50.0

    # Position loop: velocity command = v_ff + PID(position error)
    kp_pos: 1.0
    ki_pos: 0.05
    kd_pos: 0.2
    max_pos_integral: 2.0           # m*s, anti-windup clamp

    # Yaw loop
    kp_yaw: 1.5

    # Output limits (/cmd_vel)
    max_horizontal_velocity: 30.0   # m/s
    max_vertical_velocity: 5.0      # m/s
    max_yaw_rate: 1.5               # rad/s

    setpoint_timeout: 0.3           # s, then command zero velocity
