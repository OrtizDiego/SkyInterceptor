# Target tracker (IMM-EKF, plan §4.1, docs/TRACKER.md)
# The filter values match the defaults of the estimation library, which were
# tuned on the synthetic trajectories of its unit tests.
# Class whitelists for target selection come from follow_params.yaml / intercept_params.yaml.
target_tracker_node:
  ros__parameters:
    publish_rate: 50.0              # Hz, /tracks and /target/state (predict-only between updates)
    world_frame: "map"              # Frame of position_world (target_3d_localizer target_frame)

    # Perception publishes one TargetDetection per object; detections whose stamps
    # are this close form one frame for the tracker
    frame_grouping:
      stamp_tolerance: 0.005        # s, well below the 33 ms sensor period
      timeout: 0.01                 # s after the first detection arrived, unless a newer frame closes it

    # Process noise (continuous white-noise spectral densities)
    process_noise_acc: 0.3          # CV and CT models, (m/s^2)^2 / Hz
    process_noise_jerk: 1.0         # CA model, (m/s^3)^2 / Hz
    process_noise_turn_rate: 0.2    # CT model, (rad/s^2)^2 / Hz

    # Fallback 3D position measurement noise when a detection carries no covariance
    measurement_noise_pos: 0.3      # m (std dev)

    # IMM model sets, chosen per track class: aerial for uav, ground for everything else.
    # Markov transition matrices are row-major, rows sum to 1, and give the
    # switching probabilities over transition_interval seconds (rescaled to the
    # actual time step, so they don't depend on the detection rate).
    imm:
      transition_interval: 1.0      # s
      ground_models: ["cv", "ca"]
      ground_transition: [0.90, 0.10,
                          0.20, 0.80]
      aerial_models: ["cv", "ct"]
      aerial_transition: [0.90, 0.10,
                          0.20, 0.80]
      # Prior std devs of a track started from a single position fix
      ground_init_velocity_std: 5.0   # m/s
      aerial_init_velocity_std: 10.0  # m/s
      init_acceleration_std: 2.0      # m/s^2 (CA)
      init_turn_rate_std: 0.5         # rad/s (CT)

    # Gating and track management
    gate_probability: 0.99          # chi-square gate, 3 DOF
    spawn_gate_probability: 0.9999  # No new track from a detection this close to a track that missed
    confirm_m: 3                    # Confirm after M hits ...
    confirm_n: 5                    # ... in the last N frames
    max_missed_frames: 10           # Delete a confirmed track after this many misses AND coast_timeout
    max_position_variance: 50.0     # m^2, delete when trace(P_pos) exceeds this
    coast_timeout: 2.0              # s, predict through occlusion, then is_valid=false
    min_heading_speed: 0.5          # m/s, hold the heading below this speed ...
    heading_speed_sigmas: 3.0       # ... or below this many std devs of the speed estimate

    # Target selection (/target/state): operator track_id if set, else the closest
    # confirmed eligible track to the drone
    target_selection:
      switch_margin: 3.0            # m, another track must be this much closer to take over
