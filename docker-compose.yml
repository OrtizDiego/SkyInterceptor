version: '3.8'

# The base service, shared by every host. A host-specific overlay is always
# layered on top of it:
#
#   docker-compose.wsl.yml     WSL2 (Windows): GPU rendering through Mesa's D3D12
#                              driver, the WSLg display sockets
#   docker-compose.native.yml  native Linux: GPU rendering through the NVIDIA GLX
#                              driver the container toolkit injects
#
# The Makefile picks the overlay by itself (it reads /proc/version), so use
# `make up`, `make build`, ... rather than calling docker compose directly. To
# call it by hand:
#
#   docker compose -f docker-compose.yml -f docker-compose.native.yml up -d
#
# See DOCKER.md.

services:
  # Unified Interceptor Drone Environment
  interceptor:
    build:
      context: .
      dockerfile: Dockerfile
    image: interceptor-drone:latest
    container_name: interceptor

    # Privileged mode for Hardware/GPU access
    privileged: true
    runtime: nvidia
    network_mode: host

    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=0
      - GAZEBO_MODEL_PATH=/usr/share/gazebo-11/models
      - WORKSPACE=/workspace/interceptor_ws

    volumes:
      # Source Code (Live Edit). Relative to the directory compose is started
      # from: start it from the main checkout, or the container builds a worktree.
      - ./interceptor_ws/src:/workspace/interceptor_ws/src:rw
      # Build Artifacts (Persistent & Fast)
      - build_cache:/workspace/interceptor_ws/build
      - install_cache:/workspace/interceptor_ws/install
      - log_cache:/workspace/interceptor_ws/log
      # GUI Support
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Data sharing
      - ./bags:/workspace/bags:rw
      - ./logs:/workspace/logs:rw
      - ./scripts:/workspace/interceptor_ws/scripts:rw
      # Persistent data: datasets, weights and batch results. An absolute host
      # path, so it is the same whichever checkout or worktree started the
      # container, and it survives a container recreate. Big artefacts never go
      # in the container's /tmp. (`make up` creates the host directory.)
      - ${HOME}/skyinterceptor-data:/workspace/data:rw
      # Host Configs
      - ~/.ssh:/root/.ssh:ro
      - ~/.gitconfig:/root/.gitconfig:ro

    stdin_open: true
    tty: true
    working_dir: /workspace/interceptor_ws
    restart: unless-stopped

volumes:
  build_cache:
  install_cache:
  log_cache:
